version: "3.8"

services:
  kaleegpt:
    # build your FastAPI + static UI app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    depends_on:
      - rag-backend
    environment:
      - RAG_ENDPOINT=http://rag-backend:5000/api/query

  rag-backend:
    # stub RAG service—swap in your actual RAG image or build context
    build:
      context: ./rag-backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./rag-backend:/app
    environment:
      - VECTOR_DB_PATH=/data/index.db

networks:
  default:
    name: kaleegpt-net
